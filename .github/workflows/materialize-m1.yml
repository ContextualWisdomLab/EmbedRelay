name: Materialize reviewed M1 source

on:
  push:
    branches:
      - feat/m1-space-registry-vector-safety

permissions:
  contents: write

concurrency:
  group: embedrelay-m1-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'bootstrap: upload reviewed M1 source archive' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out materialization branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/m1-space-registry-vector-safety
          fetch-depth: 0

      - name: Verify and extract reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          archive_b64="$RUNNER_TEMP/embedrelay-m1-green.tar.gz.b64"
          archive="$RUNNER_TEMP/embedrelay-m1-green.tar.gz"
          shopt -s nullglob
          parts=(bootstrap/archive.part-*)
          if [ "${#parts[@]}" -ne 9 ]; then
            echo "::error::Expected 9 ordered archive parts; found ${#parts[@]}."
            exit 1
          fi
          printf '%s\n' "${parts[@]}" | LC_ALL=C sort | xargs cat >"$archive_b64"
          base64 --decode "$archive_b64" >"$archive"
          printf '%s  %s\n' \
            'a125bb5c991d963cf554a20e944111165d09a305ccc4c2a0922a7d73b5275af9' \
            "$archive" | sha256sum -c -
          if tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo '::error::Archive contains an unsafe path.'
            exit 1
          fi
          if tar -tvzf "$archive" | awk '$1 ~ /^[lh]/ { found=1 } END { exit(found ? 0 : 1) }'; then
            echo '::error::Archive contains a symlink or hard link.'
            exit 1
          fi
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          rm -rf bootstrap
          rm -f .github/workflows/materialize-m1.yml
          python3 scripts/check_contracts.py
          python3 -m unittest tests/test_repository_contracts.py -v

      - name: Commit exact reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'feat: implement M1 space registry and vector safety'
          git push origin HEAD:feat/m1-space-registry-vector-safety
